name: pages

# 저장소에는 원본이 올라가고, 공개되는 것은 release.py가 만든 _release/ 뿐이다.
# README, DESIGN, scripts 같은 작업 파일은 사이트 주소로 열리지 않는다.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Only the share previews need it, and release.py says so and carries on
      # when it is missing — the site itself has no dependencies at all.
      - name: Install the imaging library
        run: python3 -m pip install --disable-pip-version-check --quiet pillow

      - name: Build the release
        run: python3 scripts/release.py

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _release

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      # deploy-pages@v5 currently emits Node's upstream punycode deprecation.
      NODE_OPTIONS: --no-deprecation
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
