<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https:; connect-src 'self'; base-uri 'none'; form-action 'none'">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="color-scheme" content="light">
    <meta name="robots" content="noindex">
    <title>Admin — Habin Song Photographs</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23fff'/%3E%3Crect x='3' y='3' width='10' height='10' fill='none' stroke='%23111'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="../styles.css?v=20260802-responsive-v4">
    <link rel="stylesheet" href="admin.css?v=20260802-workspace-v11">
    <script type="module" src="admin.js?v=20260802-workspace-v10" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#composer" data-i18n="a.skip">Skip to composer</a>

    <div class="lang-bar">
      <nav class="lang-switch" aria-label="Language" data-i18n-attrs="aria-label:lang.aria">
        <button type="button" data-lang="ko" lang="ko" aria-pressed="false">한국어</button>
        <button type="button" data-lang="en" lang="en" aria-pressed="false">English</button>
        <button type="button" data-lang="ja" lang="ja" aria-pressed="false">日本語</button>
        <button type="button" data-lang="zh" lang="zh-Hans" aria-pressed="false">中文</button>
      </nav>
    </div>

    <header class="site-header" aria-label="Admin header" data-i18n-attrs="aria-label:a.header.aria">
      <a class="wordmark" href="../">Habin Song</a>
      <nav class="top-nav" aria-label="Admin navigation" data-i18n-attrs="aria-label:a.nav.aria">
        <a href="../" data-i18n="a.nav.site">Site</a>
        <a href="#export" data-i18n="a.nav.export">Export</a>
      </nav>
    </header>

    <main>
      <section class="intro admin-hero" aria-labelledby="admin-title">
        <h1 id="admin-title" data-i18n="a.hero.title">Compose a post</h1>
      </section>

      <section id="composer" class="admin-shell" aria-labelledby="composer-title">
        <form id="post-form" class="admin-form">
          <div class="section-head admin-head">
            <h2 id="composer-title" data-i18n="a.details.title">Post details</h2>
            <div class="admin-head-tools">
              <p id="save-status" class="count" aria-live="polite" data-i18n="a.status.saved">Draft saved locally</p>
              <button type="button" id="preview-toggle" class="preview-toggle" aria-haspopup="dialog" aria-controls="preview-dialog" data-i18n="a.preview.open">전체 화면 미리보기</button>
            </div>
          </div>

          <label class="title-field">
            <span data-i18n="a.field.title">Title</span>
            <input name="title" required autocomplete="off" placeholder="A roll from Jongno" data-i18n-attrs="placeholder:a.field.title.ph">
          </label>

          <label class="excerpt-field">
            <span data-i18n="a.field.excerpt">Excerpt</span>
            <textarea name="excerpt" rows="3" required placeholder="A short factual summary for the post list." data-i18n-attrs="placeholder:a.field.excerpt.ph"></textarea>
          </label>

          <fieldset class="editor-fieldset">
            <legend data-i18n="a.editor.legend">Body</legend>
            <div class="editor-toolbar" role="toolbar" aria-label="Editing tools" aria-controls="editor-canvas" data-i18n-attrs="aria-label:a.editor.toolbar.aria">
              <button type="button" data-ed-text="paragraph" data-i18n="a.block.paragraph">Paragraph</button>
              <button type="button" data-ed-text="heading" data-i18n="a.block.heading">Heading</button>
              <button type="button" data-ed-text="quote" data-i18n="a.block.quote">Quote</button>
              <span class="editor-toolbar-divider" aria-hidden="true"></span>
              <button type="button" data-ed-format="bold" aria-pressed="false" data-i18n="a.format.bold">Bold</button>
              <button type="button" data-ed-format="italic" aria-pressed="false" data-i18n="a.format.italic">Italic</button>
              <button type="button" data-ed-format="underline" aria-pressed="false" data-i18n="a.format.underline">Underline</button>
              <button type="button" data-ed-size="small" data-i18n="a.format.size.small">Small</button>
              <button type="button" data-ed-size="normal" data-i18n="a.format.size.normal">Normal</button>
              <button type="button" data-ed-size="large" data-i18n="a.format.size.large">Large</button>
              <span class="editor-toolbar-divider" aria-hidden="true"></span>
              <button type="button" data-ed-insert="photo" data-i18n="a.block.photo">Add photo</button>
              <button type="button" data-ed-insert="all-photos" data-i18n="a.block.add-all">Add all photos</button>
              <button type="button" data-ed-insert="gallery" data-i18n="a.block.gallery">Gallery</button>
              <button type="button" data-ed-insert="link-list" data-i18n="a.block.link-list">Links</button>
            </div>
            <output id="editor-notice" class="editor-notice" aria-live="polite"></output>
            <div id="editor-canvas" class="editor-canvas" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Post body" aria-placeholder="Start writing here" aria-describedby="editor-notice" data-placeholder="Start writing here" data-i18n-attrs="aria-label:a.editor.canvas.aria;aria-placeholder:a.editor.canvas.placeholder;data-placeholder:a.editor.canvas.placeholder"></div>
          </fieldset>

          <aside class="preview-pane" aria-labelledby="preview-pane-title">
            <header class="preview-pane-head">
              <h2 id="preview-pane-title" data-i18n="a.preview.compare">작성 미리보기</h2>
              <span data-i18n="a.preview.live">자동 갱신</span>
            </header>
            <article id="preview-inline" class="preview-content preview-inline post-article"></article>
          </aside>

          <fieldset id="photo-zone">
            <legend data-i18n="a.photos.legend">Photographs</legend>
            <div class="photo-picker">
              <input id="photo-files" class="visually-hidden" type="file" accept="image/*" multiple aria-describedby="photo-status">
              <div class="photo-picker-copy">
                <strong data-i18n="a.photos.pick.title">사진 가져오기</strong>
                <span data-i18n="a.photos.multiple">여러 장 선택 가능</span>
              </div>
              <button type="button" id="photo-picker-button" class="photo-picker-button" data-i18n="a.photos.pick">사진 선택</button>
            </div>
            <progress id="photo-progress" class="photo-progress" max="1" value="0" hidden></progress>
            <output id="photo-status" class="photo-status" aria-live="polite" data-i18n="a.assets.empty">선택된 이미지 파일이 없습니다.</output>
            <div class="asset-list-tools">
              <p id="asset-count" class="count" aria-live="polite"></p>
              <button type="button" id="asset-details-toggle" class="asset-details-toggle" hidden></button>
            </div>
            <div id="asset-list" class="asset-list" aria-live="polite"></div>
          </fieldset>

          <details class="optional-fields post-settings">
            <summary data-i18n="a.settings.more">게시 설정 · 날짜, 상태, 시리즈, 태그</summary>
            <div class="field-grid">
              <label>
                <span data-i18n="a.field.date">Date</span>
                <input name="date" type="date" required>
              </label>
              <label>
                <span data-i18n="a.field.status">Status</span>
                <select name="status">
                  <option value="published" data-i18n="a.status.published">Published</option>
                  <option value="draft" data-i18n="a.status.draft">Draft</option>
                </select>
              </label>
            </div>
            <div class="field-grid">
              <label>
                <span data-i18n="a.field.series">Series</span>
                <input name="series" list="series-list" autocomplete="off" placeholder="Jeju 2026" data-i18n-attrs="placeholder:a.field.series.ph">
                <datalist id="series-list"></datalist>
              </label>
              <label>
                <span data-i18n="a.field.tags">Tags</span>
                <input name="tags" autocomplete="off" placeholder="film, seoul, black-and-white" data-i18n-attrs="placeholder:a.field.tags.ph">
              </label>
            </div>
            <div class="field-grid">
              <label>
                <span data-i18n="a.field.soundtrack">Sound track (YouTube address)</span>
                <input name="soundtrack" autocomplete="off" placeholder="https://www.youtube.com/watch?v=…">
              </label>
              <label>
                <span data-i18n="a.field.soundtrack.label">Sound track label</span>
                <input name="soundtrackLabel" autocomplete="off" placeholder="Artist — Song">
              </label>
            </div>
          </details>

          <section id="export" class="export-panel" aria-labelledby="export-title">
            <h2 id="export-title" data-i18n="a.export.title">Build content bundle</h2>
            <div class="export-actions">
              <button type="button" id="download-zip" data-i18n="a.btn.zip">Download ZIP</button>
              <button type="button" id="download-json" data-i18n="a.btn.json">Download JSON</button>
              <button type="button" id="import-json" data-i18n="a.btn.import">Import JSON</button>
              <button type="button" id="reset-draft" data-i18n="a.btn.reset">Reset draft</button>
            </div>
            <input id="import-file" type="file" accept="application/json,.json" hidden>
            <output id="validation-output" class="validation-output" aria-live="polite"></output>
          </section>
        </form>

      </section>
    </main>

    <dialog id="preview-dialog" class="preview-dialog" aria-labelledby="preview-title">
      <header class="preview-dialog-bar">
        <h2 id="preview-title" data-i18n="a.preview.title">Preview</h2>
        <button type="button" id="preview-close" class="preview-close" aria-label="Close preview" data-i18n-attrs="aria-label:a.preview.close"><span aria-hidden="true">×</span></button>
      </header>
      <article id="preview" class="preview-content preview-page post-article"></article>
    </dialog>
  </body>
</html>
