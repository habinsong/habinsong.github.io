<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- The inline script is allowed by its sha256 hash; recompute it if the script changes. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-vxrqkZxckW2SHcUz2LCTmtHyAyTcwjhnX+OiIlUiwyI='; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="color-scheme" content="light">
    <meta name="robots" content="noindex">
    <title>404 — Habin Song</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23fff'/%3E%3Crect x='3' y='3' width='10' height='10' fill='none' stroke='%23111'/%3E%3C/svg%3E">
    <!-- GitHub Pages serves this file for any missing path, so every asset and style is inlined: relative URLs would break at nested paths. -->
    <style>
      * { box-sizing: border-box; }
      html { background: #ffffff; color: #111111; font-family: Georgia, "Times New Roman", serif; }
      body { margin: 0; min-height: 100dvh; display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; overflow-wrap: break-word; }
      :lang(ko) { word-break: keep-all; }
      :lang(ja), :lang(zh) { line-break: strict; }
      main { flex: 1; width: min(calc(100% - 48px), 1120px); margin: 0 auto; padding: 80px 0; }
      .kicker { margin: 0 0 16px; color: #8a8a8a; font-family: "Helvetica Neue", Arial, sans-serif; font-size: 12px; font-weight: 300; letter-spacing: 0.18em; line-height: 1.4; text-transform: uppercase; }
      h1 { margin: 0; max-width: 720px; color: #222222; font-size: clamp(28px, 4vw, 44px); font-weight: 300; letter-spacing: -0.015em; line-height: 1.2; text-wrap: balance; }
      p { max-width: 720px; margin: 16px 0 0; color: #5c5c5c; font-size: clamp(16px, 2vw, 18px); line-height: 1.7; text-wrap: pretty; }
      a { color: #111111; text-decoration: none; border-bottom: 1px solid #111111; transition: color 150ms ease, border-color 150ms ease; }
      a:hover { color: #5c5c5c; border-bottom-color: #5c5c5c; }
      a:focus-visible { outline: 1px solid #111111; outline-offset: 4px; }
      .home { display: inline-block; margin-top: 40px; font-family: "Helvetica Neue", Arial, sans-serif; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <main>
      <p class="kicker" id="kicker">404</p>
      <h1 id="title">Page not found.</h1>
      <p id="copy">The requested page does not exist or has moved.</p>
      <a class="home" id="home" href="/">Back to home</a>
    </main>
    <script>
      (function () {
        var MESSAGES = {
          ko: { title: "페이지를 찾을 수 없습니다.", copy: "요청하신 페이지가 없거나 이동되었습니다.", home: "홈으로", lang: "ko" },
          en: { title: "Page not found.", copy: "The requested page does not exist or has moved.", home: "Back to home", lang: "en" },
          ja: { title: "ページが見つかりません。", copy: "お探しのページは存在しないか、移動しました。", home: "ホームへ戻る", lang: "ja" },
          zh: { title: "未找到页面。", copy: "请求的页面不存在或已移动。", home: "返回首页", lang: "zh-Hans" }
        };
        var lang = "en";
        try {
          var saved = window.localStorage.getItem("habin-lang");
          if (saved && MESSAGES[saved]) lang = saved;
        } catch (error) { /* storage unavailable */ }
        if (lang === "en") {
          var preferences = navigator.languages || [navigator.language];
          for (var index = 0; index < preferences.length; index += 1) {
            var base = (preferences[index] || "").slice(0, 2).toLowerCase();
            if (MESSAGES[base]) { lang = base; break; }
          }
        }
        var message = MESSAGES[lang];
        document.documentElement.lang = message.lang;
        document.getElementById("title").textContent = message.title;
        document.getElementById("copy").textContent = message.copy;
        var home = document.getElementById("home");
        home.textContent = message.home;
        // Project pages live under /<repo>/, so "/" would leave the site; keep the first path segment.
        var host = window.location.hostname;
        var segments = window.location.pathname.split("/").filter(Boolean);
        if (host.endsWith(".github.io") && segments.length > 0) {
          home.href = "/" + segments[0] + "/";
        }
      })();
    </script>
  </body>
</html>
